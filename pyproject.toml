[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyproject"
version = "1.0.1"
description = "A CLI tool to create and rename pipx-installable Python projects"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
pyproject = "pyproject.pyproject:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

